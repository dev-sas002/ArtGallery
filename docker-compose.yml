services:
  gallery:
    build:
      context: .
      dockerfile: Dockerfile
    image: art-gallery:latest
    container_name: art-gallery
    # The gallery is seeded from data/catalog.json, so this is the whole stack:
    # `docker compose up` gives a populated app with no further steps.
    environment:
      # `local` (default) reads the bundled catalogue; `met` fetches live from
      # the Metropolitan Museum of Art Collection API.
      ARTWORK_SOURCE: ${ARTWORK_SOURCE:-local}
      CATALOG_CACHE_TTL_MS: ${CATALOG_CACHE_TTL_MS:-600000}
      # Optional. Unset means natural-language search falls back to the
      # built-in parser; nothing breaks.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - '8120:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
